<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <h1>Chat with <span id="bot-name"></span> <small style="font-size:.5em;color:var(--muted)">(AI assistant)</small></h1>
    <div id="log" aria-live="polite"></div>
    <form id="form">
      <input id="input" autocomplete="off" maxlength="500" placeholder="Type your question…" aria-label="Your question">
      <button class="btn" type="submit">Send</button>
    </form>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
