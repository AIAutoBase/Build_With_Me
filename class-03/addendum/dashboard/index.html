<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Brain</title>
<style>
  :root{
    --bg:#0F172A; --panel:#16223b; --panel2:#1b2946; --line:#2a3a5c;
    --ink:#F8FAFC; --muted:#94A3B8; --blue:#3B82F6; --gold:#D4A843;
    --green:#16A34A; --red:#DC2626;
    --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
    --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);padding:28px;line-height:1.5}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px}
  #status{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);
       margin-right:6px;vertical-align:1px}
  .dot.ok{background:var(--green)} .dot.err{background:var(--red)}

  /* an error must be impossible to mistake for "no data yet" */
  .error{margin:18px 0;padding:16px 18px;border:2px solid var(--red);border-radius:10px;
         background:rgba(220,38,38,.12);font-size:14px}
  .error h3{font-size:14px;margin-bottom:6px;color:#ff9d9d;font-family:var(--mono);
            text-transform:uppercase;letter-spacing:.1em}
  .error code{font-family:var(--mono);font-size:12.5px;background:rgba(0,0,0,.35);
              padding:2px 6px;border-radius:4px;display:inline-block;margin-top:6px}

  .tabs{display:flex;gap:2px;margin:20px 0 0;border-bottom:1px solid var(--line)}
  .tab{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);
       font-family:var(--sans);font-size:14px;font-weight:600;padding:11px 18px;cursor:pointer;
       letter-spacing:-.01em;position:relative;top:1px}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--ink);border-bottom-color:var(--blue)}
  .tab .badge{font-family:var(--mono);font-size:10px;font-weight:700;margin-left:7px;
      padding:2px 6px;border-radius:999px;background:rgba(59,130,246,.2);color:#9dc4ee;vertical-align:1px}
  .panel-body{display:none;padding-top:4px} .panel-body.on{display:block}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:22px 0}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .tile .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
  .tile .v{font-size:44px;font-weight:800;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
  .tile.alert{border-color:var(--gold)} .tile.alert .v{color:var(--gold)} .tile.alert .k{color:var(--gold)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:22px 0}
  .card .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
           color:var(--blue);margin-bottom:10px}
  .askrow{display:flex;gap:10px;flex-wrap:wrap}
  input[type=text]{flex:1 1 320px;min-width:0;background:var(--bg);color:var(--ink);
     border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--sans);font-size:15px}
  input[type=text]:focus{outline:none;border-color:var(--blue)}
  input[type=text]::placeholder{color:var(--muted)}
  .btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:12px 22px;
       font-family:var(--sans);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn:hover:not(:disabled){background:#2f6fd8}
  .btn:disabled{background:var(--panel2);color:var(--muted);cursor:default}

  /* A refusal is the system working. Style it as an error and people learn to treat
     "I don't know" as a bug, then tune the threshold down until it stops "failing". */
  .answer{display:none;margin-top:16px;padding:16px 18px;border-radius:10px;
          background:var(--panel2);border:1px solid var(--line);font-size:15px}
  .answer.refused{color:var(--muted);font-style:italic;border-style:dashed}
  .answer.failed{border-color:var(--red);background:rgba(220,38,38,.12)}
  .srcs{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
  .src{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:3px 9px;
       border-radius:999px;background:rgba(59,130,246,.18);color:#9dc4ee}

  #drop{border:2px dashed var(--line);border-radius:14px;padding:44px 20px;text-align:center;
        background:var(--panel);cursor:pointer;transition:border-color .12s,background .12s}
  #drop:hover,#drop.over{border-color:var(--blue);background:var(--panel2)}
  #drop .big{font-size:17px;font-weight:700;letter-spacing:-.01em}
  #drop .small{color:var(--muted);font-size:13px;margin-top:7px}
  #drop .fmts{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.14em;
              margin-top:14px;text-transform:uppercase}
  .queue{margin-top:18px;display:flex;flex-direction:column;gap:8px}
  .qrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
        border-left-width:3px;border-radius:9px;padding:11px 15px;font-size:14px}
  .qrow .name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qrow .note{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
  .qrow .ico{font-family:var(--mono);font-size:13px;width:14px;text-align:center}
  .qrow.work{border-left-color:var(--blue)}   .qrow.work .ico{color:var(--blue)}
  .qrow.ok{border-left-color:var(--green)}    .qrow.ok .ico{color:#86efac}
  .qrow.thin{border-left-color:var(--gold)}   .qrow.thin .ico{color:var(--gold)} .qrow.thin .note{color:#f0d08a}
  .qrow.empty{border-left-color:var(--muted);color:var(--muted);font-style:italic}
  .qrow.fail{border-left-color:var(--red);background:rgba(220,38,38,.1)}
  .qrow.fail .ico{color:#ff9d9d} .qrow.fail .note{color:#ff9d9d;font-style:normal}

  h2{font-size:15px;font-weight:700;margin:26px 0 10px;text-transform:uppercase;
     letter-spacing:.08em;color:var(--muted)}
  .wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{background:var(--panel2);text-align:left;padding:10px 14px;font-size:11px;letter-spacing:.1em;
     text-transform:uppercase;color:var(--muted);font-weight:700}
  td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
  td.mono{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
  td.num{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
        padding:3px 9px;border-radius:999px;background:rgba(59,130,246,.18);color:#9dc4ee}
  .pill.lead{background:rgba(212,168,67,.2);color:#f0d08a}
  .pill.client{background:rgba(22,163,74,.2);color:#86efac}
  .pill.invoice{background:rgba(147,112,219,.2);color:#cbb6f5}
  .pill.unclassified{background:rgba(220,38,38,.2);color:#ff9d9d}
  .empty-row{padding:26px 14px;color:var(--muted);text-align:center;font-size:14px}
  .forget{background:transparent;border:1px solid var(--line);color:var(--muted);font-family:var(--mono);
          font-size:11px;padding:4px 10px;border-radius:5px;cursor:pointer}
  .forget:hover{border-color:var(--red);color:#ff9d9d;background:rgba(220,38,38,.1)}
  footer{margin-top:26px;color:var(--muted);font-size:12px;font-family:var(--mono)}
</style>
</head>
<body>

<header>
  <h1>The Brain</h1>
  <span class="sub">your documents, your inbox</span>
  <span id="status"><span class="dot"></span><span id="statusText">connecting…</span></span>
</header>

<div class="tabs" id="tabs">
  <button class="tab" data-tab="inbox">Inbox <span class="badge" id="badge-inbox">–</span></button>
  <button class="tab on" data-tab="ask">Ask</button>
  <button class="tab" data-tab="documents">Documents <span class="badge" id="badge-documents">–</span></button>
</div>

<div class="panel-body" id="panel-inbox"></div>
<div class="panel-body on" id="panel-ask"></div>
<div class="panel-body" id="panel-documents"></div>

<footer id="foot">—</footer>

<script src="config.js"></script>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// The shell. It owns three things and nothing else: the tab bar, loading each
// tab's HTML the first time you open it, and the handful of helpers every tab
// needs. Each tab file is independent - break one and the other two still work.
// ─────────────────────────────────────────────────────────────────────────────
const BRAIN = {
  n8n: (window.BRAIN_N8N || "http://localhost:5678").replace(/\/+$/, ""),

  url(path) { return this.n8n + "/webhook/" + path; },

  $(id) { return document.getElementById(id); },

  // Everything shown has been through a model, an email, or a filename. Escape it.
  esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  },

  when(ts) {
    if (!ts) return "";
    const mins = Math.round((Date.now() - new Date(ts)) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    if (mins < 1440) return Math.round(mins / 60) + "h ago";
    return Math.round(mins / 1440) + "d ago";
  },

  live(ok, text) {
    document.querySelector("#status .dot").className = "dot " + (ok ? "ok" : "err");
    BRAIN.$("statusText").textContent = text || (ok ? "live" : "disconnected");
  },

  // One place that knows what a dead webhook looks like, so every tab says the
  // same thing about it instead of three different half-true things.
  async get(path) {
    const res = await fetch(this.url(path), { cache: "no-store" });
    if (!res.ok) throw new Error("the " + path + " webhook answered " + res.status +
                                 " " + res.statusText + " — is the workflow Active?");
    const raw = await res.json();
    return Array.isArray(raw) ? (raw[0] || {}) : raw;   // n8n wraps single items
  },

  async post(path, body) {
    const res = await fetch(this.url(path), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error("the " + path + " webhook answered " + res.status +
                                 " " + res.statusText);
    const raw = await res.json();
    return Array.isArray(raw) ? (raw[0] || {}) : raw;
  },

  fail(el, msg, hint) {
    el.innerHTML =
      '<div class="error"><h3>Can\'t reach the data</h3><div>' + BRAIN.esc(msg) +
      '</div><code>' + BRAIN.esc(hint || "") + '</code></div>';
    BRAIN.live(false);
  }
};
window.BRAIN = BRAIN;

// ── tab loading ─────────────────────────────────────────────────────────────
// innerHTML does not run <script> tags. Injected markup would render and do
// nothing at all, silently - so each script element is rebuilt and appended.
const loaded = {};

// Loading and showing are separate on purpose: the Inbox tab is fetched at startup
// so its badge has a number before you ever click it, and that must not steal focus
// from the tab you are actually looking at.
async function loadTab(name) {
  if (loaded[name]) return;
  loaded[name] = true;
  const panel = BRAIN.$("panel-" + name);
  try {
    const res = await fetch(name + ".html", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    panel.innerHTML = await res.text();
    panel.querySelectorAll("script").forEach(old => {
      const s = document.createElement("script");
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
  } catch (err) {
    loaded[name] = false;
    BRAIN.fail(panel, "Could not load " + name + ".html — " + err.message,
               "Is bi-brain-web running? docker compose ps");
  }
}

function showTab(name) {
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("on", t.dataset.tab === name));
  document.querySelectorAll(".panel-body").forEach(p =>
    p.classList.toggle("on", p.id === "panel-" + name));
  const already = loaded[name];
  loadTab(name);
  if (already && typeof window["refresh_" + name] === "function") {
    window["refresh_" + name]();
  }
}

document.getElementById("tabs").addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (tab) showTab(tab.dataset.tab);
});

showTab("ask");           // the tab you land on
loadTab("inbox");         // fetched quietly so its badge is populated
loadTab("documents");
BRAIN.$("foot").textContent = "n8n at " + BRAIN.n8n + " · edit config.js to change";
</script>
</body>
</html>
